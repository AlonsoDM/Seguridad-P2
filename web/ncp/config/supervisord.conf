[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:notebookconverter]
directory=/srv/app
command=/usr/local/bin/python /srv/app/app.py
environment=HOME="/home/appuser",JUPYTER_CONFIG_DIR="/home/appuser/.jupyter"
autostart=true
autorestart=true
startsecs=3
priority=10
user=appuser
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
